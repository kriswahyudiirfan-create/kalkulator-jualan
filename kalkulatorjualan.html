<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Kalkulator Jualan - Hitung Untung dan Rugi</title>

  <meta name="description"
        content="Kalkulator jualan gratis untuk menghitung modal, omzet, keuntungan, dan kerugian dengan mudah.">

  <meta name="keywords"
        content="kalkulator jualan, kalkulator keuntungan, hitung keuntungan jualan, kalkulator omzet">

  <meta name="author"
        content="Kalkulator Jualan">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dff6ff, #e8ddff);
      margin: 0;
      padding: 25px 15px;
      min-height: 100vh;
    }

    .kalkulator {
      background: white;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      color: #4f46e5;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .deskripsi {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #333;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #4f46e5;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-top: 30px;
    }

    .hasil {
      background: #f5f7ff;
      padding: 15px;
      border-radius: 12px;
    }

    .hasil p {
      margin: 10px 0;
      color: #444;
    }

    #hasilUntung {
      color: #16a34a;
      font-weight: bold;
      font-size: 18px;
    }

    .rugi {
      color: #dc2626 !important;
    }
  </style>
</head>

<body>

  <div class="kalkulator">

    <h1>KALKULATOR JUALAN</h1>

    <p class="deskripsi">
      Hitung keuntungan jualan dengan mudah.
    </p>

    <label>Modal per barang</label>
    <input
      type="text"
      id="modal"
      inputmode="numeric"
      placeholder="Contoh: 10.000"
    >

    <label>Harga jual per barang</label>
    <input
      type="text"
      id="harga"
      inputmode="numeric"
      placeholder="Contoh: 15.000"
    >

    <label>Jumlah barang</label>
    <input
      type="number"
      id="jumlah"
      placeholder="Contoh: 10"
    >

    <button id="hitung">HITUNG KEUNTUNGAN</button>

    <h2>Hasil</h2>

    <div class="hasil">
      <p id="hasilModal">Modal total: Rp0</p>

      <p id="hasilOmzet">Omzet: Rp0</p>

      <p id="hasilUntung">Keuntungan: Rp0</p>
    </div>

    <h2>Cara Menghitung Keuntungan Jualan</h2>

    <p>
     Keuntungan jualan dihitung dengan mengurangi modal dari omzet.
     </p>

     <p>
      Rumus keuntungan: omzet - modal = keuntungan.
     </p>
    
  </div>

  <script>
    let modal = document.getElementById("modal");
    let harga = document.getElementById("harga");
    let jumlah = document.getElementById("jumlah");

    document.getElementById("hitung").onclick = function() {

      let nilaiModal = Number(
        modal.value.replace(/\./g, "")
      );

      let nilaiHarga = Number(
        harga.value.replace(/\./g, "")
      );

      let nilaiJumlah = Number(jumlah.value);

      let modalTotal = nilaiModal * nilaiJumlah;

      let omzet = nilaiHarga * nilaiJumlah;

      let keuntungan = omzet - modalTotal;

      document.getElementById("hasilModal").textContent =
        "Modal total: Rp" +
        modalTotal.toLocaleString("id-ID");

      document.getElementById("hasilOmzet").textContent =
        "Omzet: Rp" +
        omzet.toLocaleString("id-ID");

      let hasilUntung =
        document.getElementById("hasilUntung");

      hasilUntung.textContent =
        (keuntungan >= 0 ? "Keuntungan: Rp" : "Kerugian: Rp") +
        Math.abs(keuntungan).toLocaleString("id-ID");

      if (keuntungan < 0) {
        hasilUntung.classList.add("rugi");
      } else {
        hasilUntung.classList.remove("rugi");
      }

    };
  </script>

</body>
</html>
